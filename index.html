<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F0A07"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Burn it"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>html{box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}body{margin:0}</style>
<title>Burn it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* 한 화면 장면: 위쪽에 사진 속 벽난로가 멀리 있고, 아래쪽 앞자리에 원근감 있게 기울어진 양피지 메모가 놓인다. 완료하면 구겨서 뒤쪽 벽난로로 던진다. 방은 어둡고 불빛만 따뜻하게. */
:root{
  --bg:#0F0A07; --fg:#F1E3C6; --muted:#B79F7C;
  --ink:#3A2414; --ink-soft:rgba(58,36,20,.58);
  --seal:#8F2118; --seal-hi:#C2402F; --seal-lo:#4F100B; --seal-ink:#F6D9BF;
  --brass:#C79A4B; --brass-lo:#7A5622; --brass-ink:#1B1208;
  --focus:#FFC77A;
  --font-serif:'Gowun Batang','Nanum Myeongjo','Apple SD Gothic Neo','Noto Serif KR',serif;
  --card-h:380px;
  color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--font-serif);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

.app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.bg{position:absolute;z-index:0;pointer-events:none}
.bg img{display:block;width:100%;height:100%}
.bg i{position:absolute;display:block}
.bg .fb{left:0;right:0;bottom:0;height:26%;background:linear-gradient(to bottom,rgba(15,10,7,0),var(--bg))}
.bg .fl{left:0;top:0;bottom:0;width:12%;background:linear-gradient(to right,var(--bg),rgba(15,10,7,0))}
.bg .fr{right:0;top:0;bottom:0;width:12%;background:linear-gradient(to left,var(--bg),rgba(15,10,7,0))}
.dim{position:absolute;z-index:1;left:0;right:0;bottom:0;height:56%;pointer-events:none;
  background:linear-gradient(to top,rgba(15,10,7,.94) 0%,rgba(15,10,7,.6) 46%,rgba(15,10,7,0) 100%)}
.paperlayer{position:absolute;inset:0;z-index:2;pointer-events:none}
.fire{position:absolute;z-index:3;display:block;pointer-events:none}
.vig{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at 50% 38%,rgba(0,0,0,0) 52%,rgba(0,0,0,.55) 100%)}
.light{position:absolute;left:0;top:0;z-index:5;pointer-events:none;mix-blend-mode:screen;opacity:.7}
.cflame{position:absolute;z-index:5;pointer-events:none;width:9px;height:15px;margin:-12px 0 0 -4.5px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
  background:radial-gradient(ellipse at 50% 72%,#fff6c8 0,#ffc65a 38%,rgba(255,120,30,0) 78%);filter:blur(.4px);
  box-shadow:0 0 12px 5px rgba(255,160,60,.4);transform-origin:50% 90%;animation:cf 1.3s ease-in-out infinite alternate}
.cflame:nth-of-type(2n){animation-duration:1.7s;animation-delay:-.6s}
@keyframes cf{0%{transform:scale(1,1) rotate(-2deg);opacity:.92}35%{transform:scale(.92,1.08) rotate(1.5deg);opacity:1}70%{transform:scale(1.05,.94) rotate(-1deg);opacity:.88}100%{transform:scale(.95,1.1) rotate(2deg);opacity:1}}

/* 앞자리에 놓인 양피지 메모 */
.card{position:fixed;z-index:10;left:0;right:0;margin-inline:auto;isolation:isolate;
  width:min(calc(100% - 40px),440px);
  bottom:calc(var(--kb,0px) + env(safe-area-inset-bottom,0px) + 14px);
  height:min(var(--card-h),calc(var(--vvh,100dvh) - env(safe-area-inset-top,0px) - 24px));
  display:flex;flex-direction:column;padding:34px 30px 24px;
  opacity:0;pointer-events:none;transform:perspective(820px) rotateX(26deg) translateY(36px);
  transition:opacity .4s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
.card.open{opacity:1;pointer-events:auto;transform:perspective(820px) rotateX(15deg) rotate(-.3deg)}
.card.snap{transition:none}
.card::before{content:"";position:absolute;inset:-6px;z-index:-1;background:var(--paper-img,#DCC28C) center/100% 100% no-repeat;
  filter:drop-shadow(0 16px 22px rgba(0,0,0,.6)) drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.note{flex:1;min-height:0;width:100%;margin:0;padding:0 0 4px;border:0;outline:0;resize:none;background:transparent;
  color:var(--ink);caret-color:var(--ink);font-family:var(--font-serif);font-size:20px;line-height:1.75}
.note::placeholder{color:var(--ink-soft)}
.card-foot{display:flex;align-items:center;justify-content:center;text-align:center;padding:2px 0 12px}
.card-foot small{text-wrap:balance;font-size:12.5px;line-height:1.45;color:var(--ink-soft)}
.seal{position:relative;width:100%;height:54px;margin:0;padding:0;border:0;display:grid;place-items:center;flex:none;
  border-radius:27px;cursor:pointer;touch-action:manipulation;
  font-size:18px;font-weight:700;letter-spacing:.06em;color:var(--seal-ink);text-shadow:0 -1px 0 rgba(0,0,0,.45),0 1px 0 rgba(255,200,170,.25);
  background:radial-gradient(circle at 34% 28%,var(--seal-hi) 0,var(--seal) 46%,var(--seal-lo) 100%);
  box-shadow:inset 0 2px 3px rgba(255,190,160,.35),inset 0 -3px 5px rgba(0,0,0,.45),0 3px 6px rgba(40,10,5,.5);
  transition:transform .15s ease,opacity .2s ease,filter .2s ease}
.seal:active{transform:scale(.94)}
.seal:disabled{opacity:.45;filter:saturate(.5);cursor:default}

/* 구겨져 날아가는 종이 */
.paper{position:absolute;will-change:transform,opacity;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))}
.sheet{position:absolute;inset:0;background:var(--paper-img,#DCC28C) center/100% 100% no-repeat;overflow:hidden}
.ptxt{position:absolute;inset:0;padding:40px 36px 28px;box-sizing:border-box;overflow:hidden;font-family:var(--font-serif);font-size:20px;line-height:1.75;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.paper .seal{pointer-events:none;position:absolute;left:30px;right:30px;bottom:22px;width:auto}
.crease{position:absolute;inset:0;opacity:0;
  background:
   radial-gradient(circle at 40% 36%,rgba(255,226,165,.38) 0,rgba(255,226,165,0) calc(var(--R) * .6)),
   radial-gradient(circle at 62% 68%,rgba(40,18,2,.62) 0,rgba(40,18,2,0) calc(var(--R) * 1.05)),
   conic-gradient(from 15deg at 46% 48%,rgba(48,22,4,.4),rgba(255,226,165,.2) 14%,rgba(48,22,4,.36) 30%,rgba(255,226,165,.16) 46%,rgba(48,22,4,.42) 62%,rgba(255,226,165,.18) 78%,rgba(48,22,4,.4)),
   linear-gradient(rgba(125,80,32,.34),rgba(125,80,32,.34))}
.char{position:absolute;inset:0;opacity:0;
  background:radial-gradient(circle at 50% 62%,rgba(255,214,120,.96) 0,rgba(255,110,24,.92) 26%,rgba(26,11,4,.97) 70%)}

/* 안내 문구 */
.hint,.after{position:fixed;z-index:12;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.hint{top:calc(env(safe-area-inset-top,0px) + 14px);margin:0;padding-inline:64px;font-size:13.5px;line-height:1.4;color:var(--fg);text-shadow:0 1px 8px rgba(0,0,0,.95);pointer-events:none;transition:opacity .6s ease}
.hint.gone{opacity:0}
.after{gap:10px;padding-inline:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);opacity:0;pointer-events:none;transition:opacity .6s ease}
.after.show{opacity:1;pointer-events:auto}
.status{margin:0;font-size:19px;line-height:1.4;text-wrap:balance;color:var(--fg);text-shadow:0 1px 10px rgba(0,0,0,.95)}
.again{min-height:46px;padding:0 26px;border:0;border-radius:23px;cursor:pointer;touch-action:manipulation;font-size:16px;font-weight:700;color:var(--brass-ink);
  background:linear-gradient(180deg,#E2B96A,var(--brass) 55%,var(--brass-lo));box-shadow:0 3px 10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,235,190,.6)}
.again:active{transform:scale(.96)}
.tally{margin:0;min-height:1.3em;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-shadow:0 1px 6px rgba(0,0,0,.9)}

.sound{position:fixed;z-index:20;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);width:42px;height:42px;margin:0;padding:0;border:0;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;touch-action:manipulation;color:var(--brass-ink);
  background:linear-gradient(180deg,#E2B96A,var(--brass) 55%,var(--brass-lo));box-shadow:0 3px 10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,235,190,.6)}
.sound svg{width:21px;height:21px}
.sound .off{display:none}
.sound[aria-pressed="false"] .on{display:none}
.sound[aria-pressed="false"] .off{display:block}

@media (prefers-reduced-motion: reduce){
  .card,.seal,.hint,.after{transition:none}
  .cflame{animation:none}
}
</style>

<main class="app" id="app">
  <div class="bg" id="bg" aria-hidden="true"><img id="bgimg" src="fireplace.jpg" alt="" decoding="async"><i class="fb"></i><i class="fl"></i><i class="fr"></i></div>
  <div class="dim" aria-hidden="true"></div>
  <div class="paperlayer" id="paperlayer" aria-hidden="true"></div>
  <canvas class="fire" id="fire" aria-hidden="true"></canvas>
  <div class="vig" aria-hidden="true"></div>
  <div class="light" id="light" aria-hidden="true"></div>

  <section class="card open" id="card" aria-label="Note">
    <textarea class="note" id="note" maxlength="1000" placeholder="Write down whatever is weighing on you" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="enter"></textarea>
    <div class="card-foot"><small>Burn it to crumple the page and toss it into the fire. Burned notes can't be read again.</small></div>
    <button class="seal" id="seal" type="button" disabled aria-label="Burn it">Burn it</button>
  </section>

  <p class="hint" id="hint">Tap once to hear the fire crackle</p>

  <div class="after" id="after">
    <p class="status" id="status" aria-live="polite"></p>
    <button class="again" id="again" type="button">Write a new thought</button>
    <p class="tally" id="tally"></p>
  </div>

  <button class="sound" id="sound" type="button" aria-pressed="true" aria-label="Mute sound">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
</main>

<script>
(function(){
  'use strict';
  var KEY = 'thought-fire-count', SKEY = 'thought-fire-sound';
  var $ = function(s){ return document.querySelector(s); };
  var root = document.documentElement;
  var bg = $('#bg'), fireCv = $('#fire'), light = $('#light'), layer = $('#paperlayer'), app = $('#app');
  var card = $('#card'), note = $('#note'), seal = $('#seal'), after = $('#after'), status = $('#status'), tally = $('#tally');
  var again = $('#again'), hint = $('#hint'), soundBtn = $('#sound');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var MSG = ['All burned. You can let it go now.', 'Nothing but ash. Feels lighter, doesn\'t it?', 'Gone with the flames.'];

  var count = 0, mode = 'write';
  try { count = Math.max(0, parseInt(localStorage.getItem(KEY) || '0', 10) || 0); } catch (e) {}
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function rnd(a, b){ return a + Math.random() * (b - a); }
  function rng(seed){
    var a = seed >>> 0;
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ================= 사진 속 좌표 (이미지 픽셀 기준) ================= */
  var IMG = { w: 848, h: 1085, fx0: 300, fy0: 575, fw: 250, fh: 230, baseX: 430, baseY: 728, coalY: 768, lightX: 430, lightY: 715,
              candles: [[661, 686], [637.5, 746]] };
  var G = null, lastW = 0, lastH = 0;

  /* ================= 불꽃 ================= */
  var fctx = fireCv.getContext('2d');
  var FW_ = 0, FH_ = 0, flames = [], embers = [], acc = 0, flare = 0, last = 0;
  function sizeFire(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    FW_ = G.fire.w; FH_ = G.fire.h;
    fireCv.width = Math.round(FW_ * dpr); fireCv.height = Math.round(FH_ * dpr);
    fireCv.style.width = FW_ + 'px'; fireCv.style.height = FH_ + 'px';
    fireCv.style.left = G.fire.l + 'px'; fireCv.style.top = G.fire.t + 'px';
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function spawnFlame(){
    var u = FH_ / 200;
    flames.push({
      x: FW_ / 2 + (Math.random() + Math.random() - 1) * FW_ * 0.27,
      y: G.baseY - Math.random() * u * 5,
      vx: rnd(-0.12, 0.12) * u,
      vy: -rnd(1.1, 2.4) * u * (1 + flare * 0.35),
      age: 0, max: rnd(42, 78),
      r: rnd(7, 14) * u * (1 + flare * 0.25),
      seed: Math.random() * 6.28
    });
  }
  function spawnEmber(){
    var u = FH_ / 200;
    embers.push({
      x: FW_ / 2 + rnd(-0.2, 0.2) * FW_, y: G.baseY + rnd(-0.05, 0.1) * FH_,
      vx: rnd(-0.25, 0.25) * u, vy: -rnd(0.35, 1.0) * u,
      age: 0, max: rnd(60, 120), s: rnd(0.7, 1.7), seed: Math.random() * 6.28
    });
  }
  function burst(n){ if (reduce) return; for (var i = 0; i < n; i++) spawnEmber(); }
  var STOPS = [[0, 255, 240, 180], [0.35, 255, 160, 45], [0.75, 220, 60, 18], [1, 160, 30, 10]];
  function col(f){
    for (var i = 1; i < STOPS.length; i++){
      if (f <= STOPS[i][0]){
        var a = STOPS[i - 1], b = STOPS[i], k = (f - a[0]) / (b[0] - a[0]);
        return Math.round(a[1] + (b[1] - a[1]) * k) + ',' + Math.round(a[2] + (b[2] - a[2]) * k) + ',' + Math.round(a[3] + (b[3] - a[3]) * k);
      }
    }
    return '160,30,10';
  }
  function frame(t){
    requestAnimationFrame(frame);
    if (!G) return;
    var dt = Math.min(2, (t - last) / 16.667 || 1); last = t;
    var u = FH_ / 200;
    flare *= Math.pow(0.985, dt);
    acc += (reduce ? 1.6 : 2.4) * (1 + flare * 1.2) * dt;
    while (acc >= 1){ if (flames.length < 300) spawnFlame(); acc -= 1; }
    if (!reduce && Math.random() < 0.05 * dt) spawnEmber();

    fctx.clearRect(0, 0, FW_, FH_);
    fctx.globalCompositeOperation = 'lighter';
    var i, k;
    for (k = 0; k < 9; k++){        // 석쇠 아래 숯불
      var cxp = FW_ * (0.26 + k * 0.06), cyp = G.coalY + Math.sin(k * 2.1) * 2;
      var ca = 0.22 + 0.16 * Math.sin(t * 0.003 + k * 1.7) + flare * 0.1, cr = FW_ * 0.09;
      var cg = fctx.createRadialGradient(cxp, cyp, 0, cxp, cyp, cr);
      cg.addColorStop(0, 'rgba(255,110,25,' + Math.max(0, ca).toFixed(3) + ')'); cg.addColorStop(1, 'rgba(255,60,10,0)');
      fctx.fillStyle = cg; fctx.fillRect(cxp - cr, cyp - cr, cr * 2, cr * 2);
    }
    for (i = flames.length - 1; i >= 0; i--){
      var p = flames[i];
      p.age += dt;
      var f = p.age / p.max;
      if (f >= 1){ flames.splice(i, 1); continue; }
      p.vx += (FW_ / 2 - p.x) * 0.0025 * dt;
      p.x += (p.vx + Math.sin(t * 0.004 + p.seed) * 0.16 * u) * dt;
      p.y += p.vy * dt;
      var rad = p.r * (1 - f * 0.8), a = Math.pow(1 - f, 1.3) * 0.42, cc = col(f);
      var gg = fctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
      gg.addColorStop(0, 'rgba(' + cc + ',' + a.toFixed(3) + ')'); gg.addColorStop(1, 'rgba(' + cc + ',0)');
      fctx.fillStyle = gg; fctx.beginPath(); fctx.arc(p.x, p.y, rad, 0, 6.2832); fctx.fill();
    }
    for (i = embers.length - 1; i >= 0; i--){
      var e = embers[i];
      e.age += dt;
      var ef = e.age / e.max;
      if (ef >= 1){ embers.splice(i, 1); continue; }
      e.x += (e.vx + Math.sin(t * 0.003 + e.seed) * 0.12 * u) * dt;
      e.y += e.vy * dt;
      var ea = (1 - ef) * (0.55 + 0.45 * Math.sin(t * 0.02 + e.seed));
      fctx.fillStyle = 'rgba(255,185,90,' + Math.max(0, ea).toFixed(3) + ')';
      fctx.beginPath(); fctx.arc(e.x, e.y, e.s, 0, 6.2832); fctx.fill();
    }
    var flick = 1 + 0.10 * Math.sin(t * 0.011) + 0.07 * Math.sin(t * 0.0271 + 1.3);
    light.style.opacity = Math.min(1, 0.5 * flick + 0.22 * flare + 0.18).toFixed(3);
  }

  /* ================= 배치 ================= */
  function layout(){
    var W = window.innerWidth, H = window.innerHeight;
    var s = H * 0.535 / 807, iw = IMG.w * s, ih = IMG.h * s, ox = (W - iw) / 2, oy = 0;
    G = { W: W, H: H, s: s, ox: ox, oy: oy };
    G.fire = { l: ox + IMG.fx0 * s, t: oy + IMG.fy0 * s, w: IMG.fw * s, h: IMG.fh * s };
    G.baseY = (IMG.baseY - IMG.fy0) * s; G.coalY = (IMG.coalY - IMG.fy0) * s;
    G.tx = ox + IMG.baseX * s; G.ty = oy + (IMG.baseY - 14) * s;           // 던진 종이가 떨어질 곳
    bg.style.left = ox + 'px'; bg.style.top = oy + 'px'; bg.style.width = iw + 'px'; bg.style.height = ih + 'px';
    bg.querySelector('.fl').style.display = bg.querySelector('.fr').style.display = (iw >= W + 24) ? 'none' : '';
    sizeFire();
    var lx = ox + IMG.lightX * s, ly = oy + IMG.lightY * s;
    light.style.width = W + 'px'; light.style.height = H + 'px';
    light.style.background = 'radial-gradient(ellipse ' + (H * 0.5) + 'px ' + (H * 0.36) + 'px at ' + lx + 'px ' + ly + 'px, rgba(255,150,60,.3), rgba(255,100,30,.1) 45%, rgba(255,80,20,0) 100%)';
    var old = app.querySelectorAll('.cflame'); for (var i = 0; i < old.length; i++) old[i].remove();
    IMG.candles.forEach(function(p){
      var d = document.createElement('div'); d.className = 'cflame';
      d.style.left = (ox + p[0] * s) + 'px'; d.style.top = (oy + p[1] * s) + 'px'; app.appendChild(d);
    });
    root.style.setProperty('--card-h', Math.max(260, Math.min(400, H * 0.44)) + 'px');
    makePaper();
  }
  window.addEventListener('resize', function(){
    var W = window.innerWidth, H = window.innerHeight;
    if (W === lastW && H < lastH && (lastH - H) / lastH > 0.2) return;    // 키보드가 올라온 경우는 다시 그리지 않는다
    if (W === lastW && H === lastH) return;
    lastW = W; lastH = H;
    layout();
  });

  // 키보드가 올라오면 메모가 키보드 위로 올라오도록
  function fit(){
    var v = window.visualViewport; if (!v) return;
    root.style.setProperty('--vvh', v.height + 'px');
    root.style.setProperty('--kb', Math.max(0, window.innerHeight - (v.height + v.offsetTop)) + 'px');
  }
  if (window.visualViewport){ visualViewport.addEventListener('resize', fit); visualViewport.addEventListener('scroll', fit); }
  fit();

  /* ================= 양피지 질감 ================= */
  function makePaper(){
    var cw = card.offsetWidth + 12, ch = card.offsetHeight + 12;
    if (!cw || !ch) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    var cv = document.createElement('canvas'); cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    var c = cv.getContext('2d'); c.scale(dpr, dpr);
    var R = rng(777 + Math.round(cw) * 31 + Math.round(ch)), m = 5, step = 9, pts = [], x, y, i;
    function j(){ return Math.abs((R() - 0.5) * 3.2) + (R() < 0.06 ? R() * 5 : 0); }
    for (x = m; x < cw - m; x += step) pts.push([x, m + j()]);
    for (y = m; y < ch - m; y += step) pts.push([cw - m - j(), y]);
    for (x = cw - m; x > m; x -= step) pts.push([x, ch - m - j()]);
    for (y = ch - m; y > m; y -= step) pts.push([m + j(), y]);
    function path(){ c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (var k = 1; k < pts.length; k++) c.lineTo(pts[k][0], pts[k][1]); c.closePath(); }
    c.save(); path(); c.clip();
    var g = c.createRadialGradient(cw * 0.5, ch * 0.42, Math.min(cw, ch) * 0.1, cw * 0.5, ch * 0.5, Math.max(cw, ch) * 0.75);
    g.addColorStop(0, '#EFDDB2'); g.addColorStop(0.55, '#E0C690'); g.addColorStop(1, '#B88F56');
    c.fillStyle = g; c.fillRect(0, 0, cw, ch);
    for (i = 0; i < 9; i++){
      var sx = R() * cw, sy = R() * ch, sr = 30 + R() * 90, sg = c.createRadialGradient(sx, sy, 0, sx, sy, sr);
      sg.addColorStop(0, 'rgba(120,78,28,' + (0.05 + R() * 0.08) + ')'); sg.addColorStop(1, 'rgba(120,78,28,0)');
      c.fillStyle = sg; c.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
    }
    var n = Math.round(cw * ch / 60);
    for (i = 0; i < n; i++){
      c.fillStyle = R() < 0.5 ? 'rgba(110,72,30,' + (0.03 + R() * 0.05) + ')' : 'rgba(255,248,225,' + (0.04 + R() * 0.06) + ')';
      c.fillRect(R() * cw, R() * ch, 0.8 + R() * 3.2, 0.6 + R() * 0.8);
    }
    [[cw * 0.34, 0, cw * 0.34, ch], [0, ch * 0.52, cw, ch * 0.52]].forEach(function(l){
      c.strokeStyle = 'rgba(80,48,15,.1)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(l[0], l[1]); c.lineTo(l[2], l[3]); c.stroke();
      c.strokeStyle = 'rgba(255,245,215,.16)'; c.lineWidth = 1; c.beginPath(); c.moveTo(l[0] + 1.3, l[1] + 1.3); c.lineTo(l[2] + 1.3, l[3] + 1.3); c.stroke();
    });
    for (var q = 0; q < 8; q++){ c.lineWidth = (8 - q) * 3.2; c.strokeStyle = 'rgba(88,52,18,.045)'; path(); c.stroke(); }
    c.restore();
    try { root.style.setProperty('--paper-img', 'url(' + cv.toDataURL('image/png') + ')'); } catch (e) {}
  }

  /* ================= 소리 (합성): 바람 소리는 아주 낮게, 장작 타닥 소리 위주 ================= */
  var audio = (function(){
    var ctx = null, master = null, white = null, brown = null, on = true, level = 0.9, ambient = 1, timer = 0, keep = null, built = false;
    try { if (localStorage.getItem(SKEY) === '0') on = false; } catch (e) {}
    function noise(sec, brownish){
      var len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0), last = 0;
      for (var i = 0; i < len; i++){
        var w = Math.random() * 2 - 1;
        if (brownish){ last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
      }
      return b;
    }
    function running(){ return !!ctx && ctx.state === 'running'; }
    function burstAt(t, freq, q, amp, dur){
      var s = ctx.createBufferSource(); s.buffer = white;
      var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
      var g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(amp, t + 0.0015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(bp); bp.connect(g); g.connect(master); s.start(t, Math.random() * 1.4, dur + 0.03);
    }
    // 작은 틱, 중간 스냅, 큰 폭발음, 연속으로 튀는 소리
    function tick(){ burstAt(ctx.currentTime, 1500 + Math.random() * 4200, 1.2 + Math.random() * 5, 0.1 + Math.random() * 0.3, 0.01 + Math.random() * 0.035); }
    function snap(){ burstAt(ctx.currentTime, 800 + Math.random() * 1800, 3 + Math.random() * 6, 0.3 + Math.random() * 0.35, 0.02 + Math.random() * 0.04); }
    function bigPop(){ var t = ctx.currentTime; burstAt(t, 300 + Math.random() * 800, 0.9, 0.55 + Math.random() * 0.35, 0.06 + Math.random() * 0.07); burstAt(t, 1800 + Math.random() * 1600, 3, 0.35, 0.025); }
    function cluster(){ var t = ctx.currentTime, n = 5 + ((Math.random() * 5) | 0); for (var i = 0; i < n; i++) burstAt(t + i * (0.012 + Math.random() * 0.03), 1800 + Math.random() * 3600, 2 + Math.random() * 5, 0.12 + Math.random() * 0.25, 0.008 + Math.random() * 0.02); }
    function crackle(){
      timer = setTimeout(function(){
        if (on && running()){
          var n = 1 + (Math.random() < 0.55 ? 1 : 0) + (Math.random() < 0.25 ? 2 : 0), i;
          if (Math.random() < ambient){
            for (i = 0; i < n; i++) setTimeout(tick, Math.random() * 80);
            if (Math.random() < 0.22) setTimeout(snap, Math.random() * 90);
          }
          if (Math.random() < 0.07 * ambient) bigPop();
          if (Math.random() < 0.05 * ambient) cluster();
        }
        crackle();
      }, 40 + Math.random() * 200);
    }
    function build(){
      if (built) return true;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      try { ctx = new AC(); } catch (e) { return false; }
      var comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = 0.002; comp.release.value = 0.12;
      master = ctx.createGain(); master.gain.value = 0; master.connect(comp); comp.connect(ctx.destination);
      white = noise(2, false); brown = noise(4, true);
      // 가공한 실제 불 소리 샘플을 반복 재생. 샘플을 못 불러오면 합성음으로 대신한다.
      var fell = false;
      function fallback(){
        if (fell) return; fell = true;
        var s = ctx.createBufferSource(); s.buffer = brown; s.loop = true;
        var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320;
        var g = ctx.createGain(); g.gain.value = 0.1; s.connect(lp); lp.connect(g); g.connect(master); s.start();
        ambient = 1;
      }
      try {
        fetch('fire.mp3').then(function(r){ if (!r.ok) throw 0; return r.arrayBuffer(); })
          .then(function(ab){ return new Promise(function(ok, no){ ctx.decodeAudioData(ab, ok, no); }); })
          .then(function(buf){
            var s = ctx.createBufferSource(); s.buffer = buf; s.loop = true;
            var g = ctx.createGain(); g.gain.value = 1.0; s.connect(g); g.connect(master); s.start();
            ambient = 0;
          }).catch(fallback);
      } catch (e) { fallback(); }
      built = true; crackle();
      return true;
    }
    function silentWav(){
      var n = 800, b = new Uint8Array(44 + n), dv = new DataView(b.buffer), i;
      function w(o, t){ for (var k = 0; k < t.length; k++) dv.setUint8(o + k, t.charCodeAt(k)); }
      w(0, 'RIFF'); dv.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
      dv.setUint32(24, 8000, true); dv.setUint32(28, 8000, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true); w(36, 'data'); dv.setUint32(40, n, true);
      for (i = 0; i < n; i++) b[44 + i] = 128;
      var bin = ''; for (i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]);
      return 'data:audio/wav;base64,' + btoa(bin);
    }
    function apply(slow){ if (master) master.gain.setTargetAtTime(on ? level : 0, ctx.currentTime, slow ? 0.9 : 0.15); }
    function start(){
      if (!build()) return;
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      try { if (!keep){ keep = new Audio(silentWav()); keep.loop = true; keep.volume = 0.01; } keep.play().catch(function(){}); } catch (e) {}
      ctx.resume().then(function(){ apply(true); onState(); }).catch(function(){});
    }
    function setOn(v){
      on = v;
      try { localStorage.setItem(SKEY, v ? '1' : '0'); } catch (e) {}
      if (!built) start(); else { apply(false); if (v && ctx.state !== 'running') ctx.resume(); }
    }
    function crumple(){
      if (!running()) return;
      var t = ctx.currentTime;
      for (var i = 0; i < 11; i++) burstAt(t + i * 0.04 + Math.random() * 0.03, 2200 + Math.random() * 5000, 1.5 + Math.random() * 3, 0.22 + Math.random() * 0.3, 0.025 + Math.random() * 0.04);
    }
    function burn(){        // 종이에 불이 붙을 때: 확 타오르는 소리는 작게, 타닥 터지는 소리를 많이
      if (!running()) return;
      var t = ctx.currentTime;
      var s = ctx.createBufferSource(); s.buffer = brown;
      var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
      bp.frequency.setValueAtTime(300, t); bp.frequency.exponentialRampToValueAtTime(800, t + 0.4); bp.frequency.exponentialRampToValueAtTime(400, t + 1.2);
      var g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.28, t + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
      s.connect(bp); bp.connect(g); g.connect(master); s.start(t, Math.random() * 2, 1.5);
      var i;
      for (i = 0; i < 22; i++) burstAt(t + 0.05 + i * 0.07 + Math.random() * 0.05, 700 + Math.random() * 3800, 1.5 + Math.random() * 5, 0.3 + Math.random() * 0.5, 0.015 + Math.random() * 0.06);
      burstAt(t + 0.1, 420, 0.9, 0.85, 0.1); burstAt(t + 0.55, 520, 0.9, 0.7, 0.09); burstAt(t + 0.95, 380, 0.9, 0.6, 0.08);
    }
    document.addEventListener('visibilitychange', function(){
      if (!ctx) return;
      if (document.hidden) ctx.suspend(); else if (on) ctx.resume();
    });
    return { start: start, setOn: setOn, crumple: crumple, burn: burn, running: running, isOn: function(){ return on; } };
  })();

  function onState(){
    soundBtn.setAttribute('aria-pressed', audio.isOn() ? 'true' : 'false');
    soundBtn.setAttribute('aria-label', audio.isOn() ? 'Mute sound' : 'Unmute sound');
    if (audio.running() || !audio.isOn()) hint.classList.add('gone');
  }
  function firstGesture(){
    if (audio.isOn()) audio.start();
    if (audio.running()){
      ['touchend', 'click', 'keydown'].forEach(function(ev){ document.removeEventListener(ev, firstGesture, true); });
    }
    onState();
  }
  ['touchend', 'click', 'keydown'].forEach(function(ev){ document.addEventListener(ev, firstGesture, true); });
  soundBtn.addEventListener('click', function(e){
    e.stopPropagation();
    audio.setOn(!audio.isOn()); onState();
  });
  onState();

  /* ================= 메모 / 태우기 ================= */
  function renderTally(){ tally.textContent = count > 0 ? 'Thoughts burned: ' + count : ''; }
  function setMode(m){
    mode = m;
    card.inert = m !== 'write';
    card.classList.toggle('open', m === 'write');
    after.classList.toggle('show', m === 'rest');
    hint.style.display = m === 'write' ? '' : 'none';
  }
  note.addEventListener('input', function(){ seal.disabled = !note.value.trim(); });
  again.addEventListener('click', function(){
    note.value = ''; seal.disabled = true; setMode('write');
  });

  function polyRect(w, h){
    var p = [], i, n = 4;
    for (i = 0; i < n; i++) p.push([w * i / n, 0]);
    for (i = 0; i < n; i++) p.push([w, h * i / n]);
    for (i = 0; i < n; i++) p.push([w - w * i / n, h]);
    for (i = 0; i < n; i++) p.push([0, h - h * i / n]);
    return p;
  }
  function polyCrumple(w, h, amt){
    var cx = w / 2, cy = h / 2, s = Math.min(w, h);
    return polyRect(w, h).map(function(q){
      var k = amt * s * (0.3 + Math.random() * 0.9), dx = cx - q[0], dy = cy - q[1], d = Math.sqrt(dx * dx + dy * dy) || 1;
      return [q[0] + dx / d * k + (Math.random() - 0.5) * amt * s * 0.25, q[1] + dy / d * k + (Math.random() - 0.5) * amt * s * 0.25];
    });
  }
  function polyBall(w, h, rad){
    var p = [];
    for (var k = 0; k < 16; k++){
      var a = Math.PI * 2 * k / 16 + (Math.random() - 0.5) * 0.18, rr2 = rad * (0.88 + Math.random() * 0.2);
      p.push([w / 2 + Math.cos(a) * rr2, h / 2 + Math.sin(a) * rr2]);
    }
    return p;
  }
  function css(p){ return 'polygon(' + p.map(function(q){ return q[0].toFixed(1) + 'px ' + q[1].toFixed(1) + 'px'; }).join(',') + ')'; }

  async function toss(){
    var text = note.value.trim();
    if (!text || mode !== 'write') return;
    setMode('burn');
    seal.disabled = true;
    audio.start();

    var v = window.visualViewport;
    var kb = v && (window.innerHeight - v.height > 100);
    note.blur();
    if (kb) await wait(380);
    fit();

    var w = card.offsetWidth + 12, h = card.offsetHeight + 12;
    var rcx = card.offsetLeft + card.offsetWidth / 2, rcy = card.offsetTop + card.offsetHeight / 2;
    var dx = G.tx - rcx, dy = G.ty - rcy;
    var R2 = Math.min(w, h) * 0.42;
    var s0 = Math.max(54, Math.min(72, G.W * 0.17)) / (R2 * 2);                  // 앞에서 던질 때의 공 크기
    var s1 = Math.max(22, G.fire.w * 0.2) / (R2 * 2);                            // 멀리 벽난로에 닿았을 때의 크기
    var apex = Math.min(110, Math.abs(dy) * 0.38);
    var PER = 'perspective(820px) ';

    var wrap = document.createElement('div');
    wrap.className = 'paper';
    wrap.style.left = (rcx - w / 2) + 'px'; wrap.style.top = (rcy - h / 2) + 'px';
    wrap.style.width = w + 'px'; wrap.style.height = h + 'px';
    wrap.style.setProperty('--R', R2 + 'px');
    wrap.innerHTML = '<div class="sheet"><div class="ptxt"></div><div class="crease"></div><div class="char"></div></div><div class="seal">Burn it</div>';
    var sheet = wrap.firstChild, txt = sheet.firstChild, crease = txt.nextSibling, charEl = crease.nextSibling, pseal = sheet.nextSibling;
    txt.textContent = text;
    layer.appendChild(wrap);

    card.classList.add('snap');
    card.classList.remove('open');
    note.value = '';
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ card.classList.remove('snap'); }); });

    try {
      if (reduce){
        await wrap.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 600, fill: 'forwards' }).finished;
      } else {
        var T = 2900;
        audio.crumple();
        var ball = polyBall(w, h, R2);
        sheet.animate([
          { clipPath: css(polyRect(w, h)), offset: 0 },
          { clipPath: css(polyCrumple(w, h, 0.05)), offset: 0.09 },
          { clipPath: css(polyCrumple(w, h, 0.17)), offset: 0.19 },
          { clipPath: css(ball), offset: 0.28 },
          { clipPath: css(ball), offset: 1 }
        ], { duration: T, fill: 'forwards' });
        txt.animate([{ opacity: 1, offset: 0 }, { opacity: 1, offset: 0.05 }, { opacity: 0, offset: 0.18 }, { opacity: 0, offset: 1 }], { duration: T, fill: 'forwards' });
        pseal.animate([{ opacity: 1, offset: 0 }, { opacity: 0, offset: 0.07 }, { opacity: 0, offset: 1 }], { duration: T, fill: 'forwards' });
        crease.animate([{ opacity: 0, offset: 0.04 }, { opacity: 1, offset: 0.24 }, { opacity: 1, offset: 1 }], { duration: T, fill: 'forwards' });
        charEl.animate([{ opacity: 0, offset: 0 }, { opacity: 0, offset: 0.62 }, { opacity: 1, offset: 0.8 }, { opacity: 1, offset: 1 }], { duration: T, fill: 'forwards' });
        setTimeout(function(){ flare = Math.max(flare, 1.2); burst(18); audio.burn(); }, T * 0.62);
        setTimeout(function(){ flare = 1.7; burst(26); }, T * 0.72);
        // 앞에서 뒤쪽 벽난로로: 공이 위로 포물선을 그리며 멀어지고(작아지고) 불 속으로 떨어진다
        var flight = wrap.animate([
          { transform: 'translate(0,0) ' + PER + 'rotateX(15deg) rotate(-.3deg) scale(1)', opacity: 1, offset: 0, easing: 'ease-in' },
          { transform: 'translate(0,0) ' + PER + 'rotateX(4deg) rotate(5deg) scale(' + (s0 * 3.2) + ')', opacity: 1, offset: 0.19, easing: 'ease-out' },
          { transform: 'translate(0,0) ' + PER + 'rotateX(0deg) rotate(-14deg) scale(' + s0 + ')', opacity: 1, offset: 0.28, easing: 'cubic-bezier(.25,.6,.5,1)' },
          { transform: 'translate(' + (dx * 0.62) + 'px,' + (dy - apex) + 'px) ' + PER + 'rotateX(0deg) rotate(230deg) scale(' + (s0 * 0.6) + ')', opacity: 1, offset: 0.44, easing: 'cubic-bezier(.5,0,.9,.7)' },
          { transform: 'translate(' + dx + 'px,' + dy + 'px) ' + PER + 'rotateX(0deg) rotate(440deg) scale(' + s1 + ')', opacity: 1, offset: 0.62 },
          { transform: 'translate(' + dx + 'px,' + (dy + 1) + 'px) ' + PER + 'rotateX(0deg) rotate(448deg) scale(' + (s1 * 0.95) + ')', opacity: 1, offset: 0.78, easing: 'ease-in' },
          { transform: 'translate(' + dx + 'px,' + (dy - 2) + 'px) ' + PER + 'rotateX(0deg) rotate(460deg) scale(' + (s1 * 0.3) + ')', opacity: 0, offset: 1 }
        ], { duration: T, fill: 'forwards' });
        await flight.finished;
      }
    } catch (e) {}

    wrap.remove();
    status.textContent = MSG[count % MSG.length];
    count += 1;
    try { localStorage.setItem(KEY, String(count)); } catch (e) {}
    renderTally();
    setMode('rest');
  }
  seal.addEventListener('click', toss);

  /* ================= 시작 ================= */
  renderTally();
  lastW = window.innerWidth; lastH = window.innerHeight;
  layout();
  for (var k = 0; k < 90; k++){            // 처음부터 불이 붙어 있도록 미리 채워 둔다
    spawnFlame();
    var q = flames[flames.length - 1];
    q.age = rnd(0, q.max); q.y += q.vy * q.age;
  }
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ makePaper(); });
})();
</script>
